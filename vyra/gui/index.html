<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Rusty</title>
  <link rel="stylesheet" href="style.css">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;500;600;700&family=Hanken+Grotesk:wght@400;500;600;700&display=swap" rel="stylesheet">
</head>
<body class="pip-mode state-idle">
  <div class="aurora-bg" aria-hidden="true"></div>

  <div class="app">
    <!-- Title / drag bar -->
    <header class="bar" id="dragBar">
      <div class="brand">
        <span class="wordmark">RUSTY</span>
        <span class="conn" id="connDot" title="Live link"></span>
      </div>
      <div class="win-ctrls">
        <button id="muteBtn" class="icon" title="Mute her voice" aria-label="Mute voice"></button>
        <button id="pinBtn" class="icon on" title="Keep on top" aria-label="Keep on top"></button>
        <button id="expandBtn" class="icon" title="Expand" aria-label="Expand"></button>
        <button id="settingsBtn" class="icon" title="Settings" aria-label="Settings"></button>
        <button id="minBtn" class="icon" title="Minimize" aria-label="Minimize"></button>
        <button id="closeBtn" class="icon danger" title="Close" aria-label="Close"></button>
      </div>
    </header>

    <main class="stage">
      <!-- Left: vitals (expanded mode) -->
      <aside class="side vitals deck-only">
        <h2 class="side-title">Vitals</h2>
        <div class="meter">
          <div class="meter-top"><span>Processor</span><span id="cpu" class="num">0%</span></div>
          <div class="track"><i id="cpuBar"></i></div>
        </div>
        <div class="meter">
          <div class="meter-top"><span>Memory</span><span id="ram" class="num">0%</span></div>
          <div class="track"><i id="ramBar"></i></div>
          <span class="meter-sub" id="ramSub">0 / 0 GB</span>
        </div>
        <div class="meter">
          <div class="meter-top"><span>Battery</span><span id="battery" class="num">—</span></div>
          <div class="track"><i id="batteryBar"></i></div>
          <span class="meter-sub" id="batterySub">AC power</span>
        </div>
        <div class="kv"><span>Graphics</span><span id="gpu" class="num">—</span></div>
        <div class="kv"><span>Mind</span><span id="model" class="num">—</span></div>

        <div class="chips">
          <button class="chip" data-cmd="open brave browser">Brave</button>
          <button class="chip" data-cmd="open youtube">YouTube</button>
          <button class="chip" data-cmd="list running applications">Running apps</button>
          <button class="chip" data-cmd="open downloads folder">Downloads</button>
          <button class="chip" data-cmd="turn volume up">Volume up</button>
          <button class="chip" data-cmd="play or pause music">Play / pause</button>
        </div>
      </aside>

      <!-- Center: the orb -->
      <section class="core">
        <div class="orb-wrap">
          <span class="ring" id="orbRing"></span>
          <div class="orb" id="orb">
            <span class="blob b1"></span>
            <span class="blob b2"></span>
            <span class="blob b3"></span>
            <span class="shimmer"></span>
            <span class="cap"></span>
          </div>
        </div>

        <p class="state-line" id="stateLine">Standing by.</p>

        <button id="wakeBtn" class="pill on" title="Toggle listening for your voice">
          <span class="pill-dot"></span><span id="wakeText">Listening for “Rusty”</span>
        </button>

        <div class="transcript" id="transcript"></div>

        <div class="chips core-chips">
          <button class="chip" data-cmd="open Raaga app and play songs">Play music</button>
          <button class="chip" data-cmd="what is currently open on my screen?">What's on screen</button>
          <button class="chip" data-cmd="check battery status">Battery</button>
          <button class="chip" data-cmd="keep the browser window and Antigravity window and close all the other windows which are currently running">Tidy desktop</button>
        </div>
      </section>

      <!-- Right: activity + memory (expanded mode) -->
      <aside class="side info deck-only">
        <div class="tabs">
          <button class="tab on" data-tab="activity">Activity</button>
          <button class="tab" data-tab="memory">Memory</button>
        </div>
        <div class="tab-body" id="tabActivity">
          <div class="log" id="logFeed"></div>
        </div>
        <div class="tab-body hidden" id="tabMemory">
          <div class="mem">
            <h3>About you</h3>
            <div id="memProfile" class="mem-list"></div>
          </div>
          <div class="mem">
            <h3>Saved links</h3>
            <div id="memLinks" class="mem-list"></div>
          </div>
          <div class="mem">
            <h3>Lately</h3>
            <p id="memJournal" class="mem-note">Nothing noted yet.</p>
          </div>
        </div>
      </aside>
    </main>

    <footer class="composer">
      <div class="field">
        <input id="input" type="text" autocomplete="off" placeholder="Talk to Rusty — or hold space to speak">
      </div>
      <button id="micBtn" class="icon mic" title="Hold space or click to speak" aria-label="Speak"></button>
      <button id="sendBtn" class="icon send" title="Send" aria-label="Send"></button>
    </footer>
  </div>

  <div class="sheet-backdrop" id="sheetBackdrop"></div>
  <aside class="sheet" id="settingsSheet" aria-hidden="true">
    <div class="sheet-head">
      <h2>Settings</h2>
      <button id="sheetClose" class="icon" title="Close" aria-label="Close settings"></button>
    </div>
    <label class="toggle-row">
      <span class="toggle-copy">
        <strong>Start with Windows</strong>
        <em>Opens Rusty in the corner when you log in</em>
      </span>
      <span class="switch"><input type="checkbox" id="autostart"><i></i></span>
    </label>
    <div class="sheet-info">
      <div class="kv"><span>Mind</span><span id="sheetModel" class="num">—</span></div>
      <div class="kv"><span>Provider</span><span id="sheetProvider" class="num">—</span></div>
      <div class="kv"><span>Latency</span><span id="ping" class="num">—</span></div>
      <div class="kv"><span>Clock</span><span id="clock" class="num">—</span></div>
    </div>
  </aside>

  <script src="app.js"></script>
</body>
</html>
